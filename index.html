<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtream TV Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f1016;
        overflow: hidden; /* App-like feel */
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      .glass-panel {
        background: rgba(30, 32, 48, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .active-glow {
        box-shadow: 0 0 20px rgba(100, 116, 139, 0.2);
      }

      /* View Transitions: Soft Cinematic Fade */
      @keyframes cinematic-fade {
        0% {
          opacity: 0;
          transform: scale(0.98) translateY(15px); /* Start slightly smaller and lower */
          filter: blur(10px); /* Soft blur start */
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }

      .animate-soft-enter {
        /* Longer duration (0.8s) and smooth easing */
        animation: cinematic-fade 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; 
      }
    </style>
